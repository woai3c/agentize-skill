name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

      - name: Check scanner syntax
        run: |
          python -m py_compile scripts/scan_repo.py tests/test_scanners.py tests/test_package_identity.py
          node --check scripts/scan_repo.cjs

      - name: Run both repository scanners
        run: |
          node scripts/scan_repo.cjs --root . --format markdown
          python scripts/scan_repo.py --root . --format markdown

      - name: Install the pinned Agent Skills reference validator
        run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate the Skill package
        run: skills-ref validate .
